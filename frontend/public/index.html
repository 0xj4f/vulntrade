<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="VulnTrade — live markets, order book, portfolio and leaderboard." />
    <title>VulnTrade — Trade the market</title>
    <!-- VULN: No CSP meta tag -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316c784'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' fill='none' stroke='%2303140c' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint (no flash). Kept tiny on purpose.
      (function () {
        try {
          var t = localStorage.getItem('vt-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      /* Pre-paint background so there is no white flash before the bundle loads. */
      html[data-theme='dark'] body { background: #0a0e17; }
      html[data-theme='light'] body { background: #f4f6f9; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
