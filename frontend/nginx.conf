# VULN: No CSP header, directory listing enabled, no security headers

# WebSocket upgrade only when the client asks for it; otherwise keep the upstream connection open
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 1.0.0: reuse connections to the services (keepalive). 0.6.0 opened a new TCP connection per
# request and ran out of source ports at ~1,300 requests/s (502 "Address not available").
upstream platform   { server backend:8080;    keepalive 64; }
upstream fx_gateway { server fx-gateway:8080; keepalive 64; }

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # VULN: Directory listing enabled
    autoindex on;

    # VULN: No security headers
    # No Content-Security-Policy
    # No X-Frame-Options  
    # No X-Content-Type-Options
    # No Referrer-Policy

    # Serve React app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1.0.0: each product has its own front door (trading gateway): REST + its WebSocket.
    # Longer paths win over /api/ below.
    location /api/fx/ {
        proxy_pass http://fx_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API requests to backend (platform: auth, users, accounts, admin ...)
    location /api/ {
        proxy_pass http://platform;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://platform;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy SockJS fallback
    location /ws-sockjs {
        proxy_pass http://platform;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy actuator
    location /actuator/ {
        proxy_pass http://platform;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy H2 console
    location /h2-console/ {
        proxy_pass http://platform;
    }

    # VULN: .env file accessible
    location ~ /\.env {
        # Not blocked!
    }
}
