services:
  # ============================================================
  # PostgreSQL - VULN: default creds, exposed port
  # ============================================================
  postgres:
    image: postgres:13
    container_name: vulntrade-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulntrade}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # VULN: exposed to host
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./database/flags.sql:/docker-entrypoint-initdb.d/03-flags.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - vulntrade-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vulntrade}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis - VULN: no authentication, exposed port
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: vulntrade-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"   # VULN: exposed to host (host port only)
    command: redis-server --save 60 1   # No --requirepass (intentional)
    networks:
      - vulntrade-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Adminer - VULN: DB admin panel exposed
  # ============================================================
  adminer:
    image: adminer:latest
    container_name: vulntrade-adminer
    ports:
      - "8081:8080"   # VULN: exposed DB admin
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vulntrade-net

  # ============================================================
  # Backend - Spring Boot (Java 11)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulntrade-backend
    ports:
      - "8085:8080"    # Main API (mapped to 8085 to avoid conflicts)
      - "5005:5005"    # VULN: debug port exposed
      - "9090:9090"    # VULN: JMX port exposed
    environment:
      # Inline defaults (match .env.example) so a fresh clone boots without a .env.
      # Weak secrets are intentional (educational lab) and stay as the defaults.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vulntrade}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: 6379   # fixed in-container port (REDIS_PORT only remaps the host side)
      JWT_SECRET: ${JWT_SECRET:-vulntrade-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-vt-api-key-12345-not-so-secret}
      FLAG_1: ${FLAG_1:-FLAG{4ctu4t0r_3xp0s3d_s3cr3ts}}
      FLAG_7: ${FLAG_7:-FLAG{st0mp_4dm1n_ch4nn3l_l34k}}
      FLAG_8: ${FLAG_8:-FLAG{h34pdump_m3m0ry_s3cr3ts}}
      FLAG_10: ${FLAG_10:-FLAG{jwt_f0rg3d_4dm1n_m4st3r}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulntrade-net
    # VULN: no resource limits
    volumes:
      - ./flags:/opt/flags:ro   # Flag 5 for RCE challenge
      - uploads:/uploads/photos  # VULN #95: photo uploads - no type restrictions
      - ./logs/vulntrade:/var/log/vulntrade  # Structured JSON logs (bind mount for SIEM/S3)

  # ============================================================
  # Frontend - React + nginx
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulntrade-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - vulntrade-net

  # ============================================================
  # Log shipper - Fluent Bit sidecar, ships JSON logs to S3
  # Every 1 minute → s3://$S3_BUCKET/vulntrade/...
  # ============================================================
  log-shipper:
    image: fluent/fluent-bit:3.1
    container_name: vulntrade-log-shipper
    volumes:
      - ./logs/vulntrade:/var/log/vulntrade:ro
      - ./log-shipper/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./log-shipper/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - fluent-bit-buffer:/var/log/fluent-bit
    environment:
      # Blank defaults: without real creds the shipper starts but fails auth cleanly.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET:-wazuh-application-logs}
    depends_on:
      - backend
    networks:
      - vulntrade-net
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  fluent-bit-buffer:

networks:
  vulntrade-net:
    driver: bridge
