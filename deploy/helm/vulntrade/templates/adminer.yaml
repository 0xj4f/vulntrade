{{- if .Values.adminer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: adminer
  labels:
    {{- include "vulntrade.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vulntrade.selector" (dict "ctx" . "component" "adminer") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  labels:
    {{- include "vulntrade.labels" . | nindent 4 }}
    app.kubernetes.io/component: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vulntrade.selector" (dict "ctx" . "component" "adminer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vulntrade.selector" (dict "ctx" . "component" "adminer") | nindent 8 }}
    spec:
      containers:
        - name: adminer
          image: {{ .Values.adminer.image }}
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres
          ports:
            - name: http
              containerPort: 8080
          {{- with .Values.adminer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
