apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "vulntrade.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "vulntrade.selector" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 80
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "vulntrade.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "vulntrade.selector" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vulntrade.selector" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      initContainers:
        # nginx resolves "backend" once at startup and exits if it can't; start it once the API answers.
        - name: wait-for-backend
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -T 3 -O /dev/null http://backend:8080/api/health; do echo waiting for backend; sleep 3; done"]
      containers:
        - name: frontend
          image: {{ include "vulntrade.image" (dict "ctx" . "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
