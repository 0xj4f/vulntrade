apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulntrade.secretName" . }}
  labels:
    {{- include "vulntrade.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
  FLAG_1: {{ .Values.secrets.flags.flag1 | quote }}
  FLAG_7: {{ .Values.secrets.flags.flag7 | quote }}
  FLAG_8: {{ .Values.secrets.flags.flag8 | quote }}
  FLAG_10: {{ .Values.secrets.flags.flag10 | quote }}
  {{- if .Values.logShipper.enabled }}
  AWS_ACCESS_KEY_ID: {{ .Values.logShipper.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.logShipper.awsSecretAccessKey | quote }}
  AWS_SESSION_TOKEN: {{ .Values.logShipper.awsSessionToken | quote }}
  {{- end }}
